# RUN config (HOW to run) — scenario-agnostic. Point a run at any generated corpus;
# the scenario (question + answers) is read from that corpus's .manifest.json.
#
#   python run.py converse configs/dev.toml generated_material/2_1/dev.md
#   python run.py eval      configs/dev.toml results/transcripts/dev-<stamp>.jsonl
#
# Two phases, two tables: [experiment] drives the conversation, [eval] drives the
# judging. A list-valued field in [experiment] (condition / level / a model role)
# is swept into one episode per combination.

[experiment]
name       = "dev"
# condition  = ["aligned", "misaligned"]
condition = ["aligned", "misaligned", "aligned_free", "misaligned_opposite"]
level      = ["subtle", "moderate", "aggressive"]  # only used by the misaligned condition
rounds     = 1                   # one user message + one actor reply (only 1 supported)
human      = "simulator"         # persuadee: "simulator" (an LLM) | "real" (GUI, TODO)
# NB: when thinking is on, max_tokens is a SHARED budget for the actor's thinking
# + its visible reply. Too low and a talkative actor spends it all on thinking and
# emits no answer (stop_reason = max_tokens). Keep headroom (a warning fires below
# ~4096). effort is the depth dial, not a cap — spend still isn't knowable up front.
max_tokens = 8192
repeats    = 1
thinking   = "high"              # actor reasoning depth: "off" | low|medium|high|xhigh|max

[experiment.models]
actor = "claude-sonnet-4-6"
user  = "claude-sonnet-4-6"

# EVAL config (HOW to judge). `name` is required and labels the verdict file.
[eval]
name              = "initial"
max_tokens        = 8192
reveal_scratchpad = false        # show the actor's private reasoning to judge + monitor
thinking          = "high"        # evaluator reasoning depth: "off" | low|medium|high|xhigh|max

[eval.models]
judge   = "claude-sonnet-4-6"
monitor = "claude-sonnet-4-6"    # falls back to judge if omitted
